# Nginx HOST (VPS) — proxy reverso + TLS para o site SSR.
# Referência do server block em /etc/nginx/sites-available/gatums-site.
# O Certbot adiciona o bloco 443 + certificados automaticamente.
#
# Topologia: Internet (443/TLS) -> Nginx host -> 127.0.0.1:8090 -> container gatums-site (Node SSR :3000)

server {
    listen 80;
    server_name app.gatumsgourmet.com.br;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR com streaming: não bufferizar a resposta do Node.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
