# A imagem é buildada no GitHub Actions e carregada na VPS via `docker load`
# (a VPS de 512MB NÃO builda: o Vite/SSR estoura o heap ao buildar aqui).
# Uso na VPS: docker compose -f docker-compose.production.yml --env-file .env up -d
services:
  gatums-site:
    image: gatums-site:latest
    container_name: gatums-site
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    # Publica apenas no loopback: o Nginx host faz o TLS e o proxy reverso.
    # O container escuta na 3000 (Node SSR); externamente só via 127.0.0.1:8090.
    ports:
      - "127.0.0.1:8090:3000"
    deploy:
      resources:
        limits:
          # Runtime SSR medido em ~48MB sob carga; 192M dá folga e preserva
          # RAM da VPS (512MB total, compartilhada com API + Nginx).
          memory: 192M
    networks:
      - gatums-site-net

networks:
  gatums-site-net:
    driver: bridge
