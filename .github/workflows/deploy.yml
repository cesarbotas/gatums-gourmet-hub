name: CI/CD — Build & Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # O npm 10.8/10.9 que acompanha o Node no runner tem um bug no resolver
      # (Arborist) que quebra `npm ci` com "Cannot read properties of null
      # (reading 'edgesOut')" em árvores com peerDeps (@cloudflare/vite-plugin,
      # wrangler). npm 11+ corrige. Fixar a versão também evita cache corrompido.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://gatumsgourmet.com.br/api/v1' }}

  deploy:
    name: Deploy to Locaweb
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_SITE_DEPLOY_PATH || '/opt/gatums-site' }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://gatumsgourmet.com.br/api/v1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          # Keepalive para builds longos na VPS (npm ci + docker build demoram):
          # sem tráfego, a sessão SSH ociosa cai com "Broken pipe" (exit 255).
          # ServerAliveInterval manda pacotes a cada 30s; CountMax tolera ~1h.
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 120
            ConnectTimeout 30
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Ensure deploy dir
        run: ssh $VPS_USER@$VPS_HOST "mkdir -p $VPS_DEPLOY_PATH"

      - name: Sync files to VPS
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            './' $VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/

      - name: Create .env on VPS from Secrets
        run: |
          printf 'VITE_API_BASE_URL=%s\n' "$VITE_API_BASE_URL" > /tmp/.env
          scp /tmp/.env $VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.env
          ssh $VPS_USER@$VPS_HOST "chmod 600 $VPS_DEPLOY_PATH/.env"
          rm /tmp/.env

      - name: Deploy on VPS
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Dispara o deploy em background na VPS (setsid), gravando saída em
          # deploy.log e o código de saída em deploy.status. Assim, se o SSH
          # cair durante o build demorado, o processo na VPS NÃO morre junto.
          ssh "$VPS_USER@$VPS_HOST" "
            cd '$VPS_DEPLOY_PATH' &&
            rm -f deploy.log deploy.status &&
            setsid bash -c 'bash deploy/deploy-site.sh > deploy.log 2>&1; echo \$? > deploy.status' </dev/null >/dev/null 2>&1 &
            echo 'Deploy disparado em background na VPS.'
          "

          # Polling: imprime as linhas novas do log e encerra quando houver status.
          PRINTED=0
          for _ in $(seq 1 120); do
            CHUNK=$(ssh "$VPS_USER@$VPS_HOST" "tail -n +$((PRINTED+1)) '$VPS_DEPLOY_PATH/deploy.log' 2>/dev/null" || true)
            if [ -n "$CHUNK" ]; then
              echo "$CHUNK"
              PRINTED=$((PRINTED + $(printf '%s\n' "$CHUNK" | wc -l)))
            fi
            CODE=$(ssh "$VPS_USER@$VPS_HOST" "cat '$VPS_DEPLOY_PATH/deploy.status' 2>/dev/null" || true)
            if [ -n "$CODE" ]; then
              echo "=== deploy-site.sh terminou com código: $CODE ==="
              [ "$CODE" = "0" ] && exit 0 || exit 1
            fi
            sleep 10
          done
          echo "::error::Timeout aguardando o deploy na VPS."
          exit 1

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://app.gatumsgourmet.com.br/ || echo "000")
            echo "Tentativa $i — HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "Site no ar!" && exit 0
            sleep 8
          done
          echo "::warning::Site não respondeu 200. Logs:"
          ssh $VPS_USER@$VPS_HOST "docker logs gatums-site --tail 30" || true
